name: Update XAUUSD Data

# Jalan otomatis tiap 30 menit, dan bisa juga dipicu manual dari tab Actions
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Wajib supaya Action ini diizinkan commit & push ke repo
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch data
        run: python fetch_data.py

      - name: Commit & push hasil data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json calendar.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update data XAUUSD [auto]"
          git push

